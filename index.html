<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <!-- Agregar el script de Babel -->
        <script src="https://unpkg.com/@babel/standalone"></script>
        <script type="text/babel" src="./components/MyButton.js"></script>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <div id="root">

        </div>
    </body>
    <script type="text/babel">
        function Saludar(params) {
            alert("hola");
        }
        
        function Despedir(params) {
            alert("adios");
        }

        function App() {
            const { useState } = React;
            const [ contador, setContador ] = useState(0);
            const [ contador2, setContador2 ] = useState(0);
            const [ visible, setVisible ] = useState(true);
            const [ alumnoCalificacion, setAlumnoCalificacion ] = useState([
                {nombre:"juan", calificacion: 10, materia: "Español"},
                {nombre:"pedro", calificacion: 9, materia: "Matematicas"},
                {nombre:"maria", calificacion: 8, materia: "Ingles"},
                {nombre:"luis", calificacion: 7, materia: "Programacion"},
                {nombre:"jose", calificacion: 6, materia: "Lengua Maya"},
            ]);

            const [visibleAlumnos, setVisibleAlumnos] = useState(
                Array(alumnoCalificacion.length).fill(true)
            );

            function ocultarAlumno(index) {
                const nuevosVisibles = [...visibleAlumnos];
                nuevosVisibles[index] = false;
                setVisibleAlumnos(nuevosVisibles);
            }

            function VerAlumnos() {
                setVisible(!visible);
            }

            function restaurarAlumnos() {
                setVisibleAlumnos(Array(alumnoCalificacion.length).fill(true));
            }
            return (
                <div>
                    <h1>¡Hola, mundo!</h1>
                    <p>Esto es un ejemplo de React.</p>
                    <MyButton titulo="Saludar" contador={contador} setContador={setContador}/>
                    <h2>Contador 1 {contador}</h2>
                    <br/>
                    <MyButton titulo="Despedir" contador={contador2} setContador={setContador2}/>
                    <h2>Contador 2 {contador2}</h2>
                    
                    <button onClick={VerAlumnos}>Mostrar/Ocultar Lista</button>

                    <div className="container">
                        {alumnoCalificacion.map((alumno, index) => (
                            visibleAlumnos[index] && (
                                <div key={index} className="card" style={{ display: visible ? 'block' : 'none' }}> 
                                    <p>Este es el alumno {alumno.nombre}</p> 
                                    <p>Calificación: {alumno.calificacion}</p>

                                    <p>Materia: {alumno.materia}</p>

                                    <button onClick={() => ocultarAlumno(index)}>Ocultar</button>
                                </div>
                            )
                        ))}
                    </div>

                    <button id="restaurar-btn" onClick={restaurarAlumnos}>Restaurar Alumnos</button>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</html>
