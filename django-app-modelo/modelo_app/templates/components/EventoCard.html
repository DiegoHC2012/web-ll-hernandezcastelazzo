<div class="evento-item-horizontal">
    <div class="evento-imagen">
        <img src="{{ imagen }}" alt="Imagen de un evento">
    </div>
    <div class="evento-contenido">
        <h3>{{ name }}</h3>
        <p><strong>Localidad: </strong>{{ localidad }}</p>
        <p><strong>Descripción:</strong></p>
        <p>{{ descripcion }}</p>
        <a class="btn_boletos" href="/boletosID/{{ eventoid }}">Boletos</a>
    </div>
</div>
