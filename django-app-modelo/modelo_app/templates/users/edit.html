{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'css/user_create.css' %}">
        <title>Editar Usuario</title>
    </head>
    <body>
        {% include 'base/header.html' %}

        <!-- Contenedor principal para separar el contenido del header y footer -->
        <div class="main-content">
            <form method="POST" action="{% url 'editUser' user.id %}" id="edit-user-form" class="user-form-container">
                {% csrf_token %}
                
                <div class="user-form-group">
                    <label for="name" class="user-form-label">Name:</label>
                    <input type="text" id="name" name="name" class="user-form-input" value="{{ user.name }}" required><br>
                </div>
            
                <div class="user-form-group">
                    <label for="email" class="user-form-label">Email:</label>
                    <input type="email" id="email" name="email" class="user-form-input" value="{{ user.email }}" required><br>
                </div>
            
                <div class="user-form-group">
                    <label for="age" class="user-form-label">Age:</label>
                    <input type="number" id="age" name="age" class="user-form-input" value="{{ user.age }}" required><br>
                </div>
                
                <div class="user-form-group">
                    <label for="rfc" class="user-form-label">RFC:</label>
                    <input type="text" id="rfc" name="rfc" class="user-form-input" value="{{ user.rfc }}" required><br>
                </div>
            
                <div class="user-form-group">
                    <label for="photo" class="user-form-label">Photo URL:</label>
                    <input type="text" id="photo" name="photo" class="user-form-input" value="{{ user.photo }}" required><br>
                </div>
            
                <button id="edit-user-button">Edit User</button>

            </form>
        </div>

        {% include 'base/footer.html' %}
        {% block scripts %}

        <!-- Scripts -->
        <script>
            const USER_EDIT_URL = "{% url 'editUser' user.id %}";
        </script>
        
        <script src="{% static 'js/user_edit.js' %}"></script>

        {% endblock %}
    </body>
</html>
